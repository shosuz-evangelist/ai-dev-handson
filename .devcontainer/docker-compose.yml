services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecsite
      POSTGRES_USER: ecsite
      POSTGRES_PASSWORD: ecsite
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
