# ============================================================
# Database
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecsite
spring.datasource.username=ecsite
spring.datasource.password=ecsite
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Flyway（スキーマは db/migration で管理する。手で書き換えない）
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# JPA
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Server / Logging
# ============================================================
server.port=8080
logging.level.org.springframework=INFO
logging.level.com.example.ecsite=DEBUG
